name: Container Build and Scan

on:
  workflow_call:
    inputs:
      image_name:
        description: "Lowercase image name, e.g. my-api"
        required: true
        type: string
      build-args:
        description: "Docker build arguments, one KEY=VALUE per line"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    name: Build, Scan and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GHCR rejects uppercase; inputs go through env to avoid shell injection.
      - name: Compute image reference
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ inputs.image_name }}
        shell: bash
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${NAME,,}:${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build locally. No registry login or push yet.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: ${{ inputs.build-args }}

      # 2. Scan the local image.
      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/trivy-image-report.json
          exit-code: "0"
          ignore-unfixed: true

      # Local ./ actions resolve to the caller repo, so reference this repo explicitly.
      - name: Trivy report and severity gate
        uses: Phattaraphon-ADMD/org-platform-ci/.github/actions/trivy-summary@v1
        with:
          report-path: ${{ runner.temp }}/trivy-image-report.json
          title: Trivy Image Scan
          fail-on-severity: HIGH,CRITICAL

      # 3. Login only after image scan succeeds.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Push the same image that was scanned.
      - name: Push verified image
        run: docker push "$IMAGE"
