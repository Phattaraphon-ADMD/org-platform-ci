name: Source Security Scan

on:
  workflow_call:
    inputs:
      severity:
        description: "Trivy severity levels"
        required: false
        type: string
        default: HIGH,CRITICAL

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/trivy-fs-report.json
          exit-code: "0"
          ignore-unfixed: true

      # Local ./ actions resolve to the caller repo, so reference this repo explicitly.
      - name: Trivy report and severity gate
        uses: company/org-platform-ci/.github/actions/trivy-summary@v1
        with:
          report-path: ${{ runner.temp }}/trivy-fs-report.json
          title: Trivy Source Scan
          fail-on-severity: ${{ inputs.severity }}
